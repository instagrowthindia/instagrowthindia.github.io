<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Followers</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
}

/* -------- LOGIN PAGE -------- */

.login-page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f3f3f3;
flex-direction:column;
}

.login-box{
background:white;
width:90%;
max-width:400px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
text-align:center;
}

.login-box h2{
margin-bottom:15px;
}

.login-box input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
margin:15px 0;
font-size:16px;
}

.login-btn{
background:linear-gradient(45deg,#ff7a00,#ff006a);
color:white;
border:none;
padding:12px;
width:100%;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

/* -------- MAIN PAGE -------- */

.main-page{
display:none;
background:linear-gradient(135deg,#a100ff,#ff6a00);
color:white;
min-height:100vh;
text-align:center;
padding-bottom:50px;
}

h1{
padding:20px;
}

.box{
background:rgba(0,0,0,0.25);
margin:20px;
padding:25px;
border-radius:20px;
}

.price{
background:#00c853;
padding:10px 20px;
border-radius:10px;
display:inline-block;
margin:10px 0;
}

button.buy{
background:#ff1744;
color:white;
border:none;
padding:12px 25px;
border-radius:10px;
cursor:pointer;
}

/* -------- POPUP -------- */

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
}

.popup-content{
background:white;
color:black;
width:90%;
max-width:350px;
border-radius:20px;
padding:20px;
position:relative;
text-align:center;
}

.close{
position:absolute;
top:10px;
right:15px;
font-size:22px;
color:red;
cursor:pointer;
}

.qr-img{
width:150px;
margin:15px auto;
display:block;
}

.popup input{
width:90%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

.success{
color:green;
font-weight:bold;
margin-top:10px;
display:none;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="login-page" id="loginPage">
<div class="login-box">
<h2>Get Instagram Followers</h2>
<input type="text" id="usernameInput" placeholder="@username">
<button class="login-btn" onclick="continueSite()">Get Instagram Followers</button>
</div>
</div>

<!-- MAIN PAGE -->
<div class="main-page" id="mainPage">

<h1>🚀 TODAY BIG OFFER 🚀</h1>

<div class="box">
<h2>1K Instagram Followers</h2>
<div class="price">₹150</div><br>
<button class="buy" onclick="openPopup()">Buy Now</button>
</div>

<div class="box">
<h2>2K Instagram Followers</h2>
<div class="price">₹200</div><br>
<button class="buy" onclick="openPopup()">Buy Now</button>
</div>

<div class="box">
<h2>3K Instagram Followers</h2>
<div class="price">₹300</div><br>
<button class="buy" onclick="openPopup()">Buy Now</button>
</div>

<div class="box">
<h2>5K Instagram Followers</h2>
<div class="price">₹350</div><br>
<button class="buy" onclick="openPopup()">Buy Now</button>
</div>

<div class="box">
<h2>10K Instagram Followers</h2>
<div class="price">₹450</div><br>
<button class="buy" onclick="openPopup()">Buy Now</button>
</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popup-content">

<span class="close" onclick="closePopup()">✖</span>

<h3>Scan QR To Pay</h3>

<img src="qr.png" class="qr-img">

<h4>After Payment Enter Details</h4>

<input type="text" id="utrInput" placeholder="Enter UTR Number">
<input type="text" id="instaInput" placeholder="Enter Instagram Link or Username">

<button class="buy" onclick="submitOrder()">Submit</button>

<div class="success" id="successMsg">
Order Checking ✅ <br>
Wait 1-2 Hour
</div>

</div>
</div>

<script>

function continueSite(){
var user = document.getElementById("usernameInput").value;
if(user === ""){
alert("Please Enter Instagram Username");
return;
}
document.getElementById("loginPage").style.display="none";
document.getElementById("mainPage").style.display="block";
}

function openPopup(){
document.getElementById("popup").style.display="flex";
}

function closePopup(){
document.getElementById("popup").style.display="none";
document.getElementById("successMsg").style.display="none";
}

function submitOrder(){
var utr = document.getElementById("utrInput").value;
var insta = document.getElementById("instaInput").value;

if(utr === "" || insta === ""){
alert("Please Fill All Details");
return;
}

document.getElementById("successMsg").style.display="block";
}

</script>

</body>
  </html>
