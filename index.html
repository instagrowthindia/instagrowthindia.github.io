<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today Big Offer</title>

<style>
html,body{
margin:0;
padding:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#ff00cc,#7b00ff,#ff2e8b);
background-size:400% 400%;
animation:glowBG 8s ease infinite;
color:white;
text-align:center;
}

@keyframes glowBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h1{padding:25px;font-size:26px;}

.card{
background:linear-gradient(135deg,#7b1fa2,#c2185b);
margin:20px auto;
padding:35px 25px;
border-radius:30px;
box-shadow:0 15px 40px rgba(0,0,0,0.4);
width:90%;
max-width:420px;
}

.price{
background:#00c853;
display:inline-block;
padding:14px 35px;
border-radius:15px;
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

.buyBtn{
background:#ff1744;
border:none;
padding:16px 45px;
border-radius:20px;
font-size:20px;
color:white;
cursor:pointer;
}

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
overflow-y:auto;
z-index:999;
color:black;
}

.popup-content{
max-width:420px;
margin:auto;
padding:20px;
}

input{
width:95%;
padding:14px;
margin:15px 0;
border-radius:12px;
border:1px solid #ccc;
}

.paymentBtn{
background:#e60000;
border:none;
padding:15px;
border-radius:15px;
font-size:18px;
color:white;
cursor:pointer;
width:95%;
}

.error{
color:red;
display:none;
}
</style>
</head>

<body>

<h1>🚀 TODAY BIG OFFER 🚀</h1>

<div class="card">
<h2>100 Instagram Followers (DEMO)</h2>
<div class="price">₹20</div><br>
<button class="buyBtn" onclick="openPopup('100 Followers DEMO','₹20')">Buy Now</button>
</div>

<div class="card">
<h2>1K Instagram Followers</h2>
<div class="price">₹150</div><br>
<button class="buyBtn" onclick="openPopup('1K Followers','₹150')">Buy Now</button>
</div>

<div class="popup" id="popup">
<div class="popup-content">
<h2 id="popupTitle"></h2>
<h3 id="popupPrice" style="color:red;"></h3>

<p>Scan & Complete Payment</p>

<input type="text" id="insta" placeholder="Enter Instagram Link">
<button class="paymentBtn" onclick="submitOrder()">Payment Done</button>
<div class="error" id="errorMsg">Please Enter Instagram Link</div>

</div>
</div>

<script>
function openPopup(title,price){
document.getElementById("popupTitle").innerText=title;
document.getElementById("popupPrice").innerText=price;
document.getElementById("popup").style.display="block";
}

function submitOrder(){
var insta=document.getElementById("insta").value.trim();
if(insta==""){
document.getElementById("errorMsg").style.display="block";
return;
}

var orderId="TG-"+Math.random().toString(36).substr(2,9).toUpperCase();

document.body.innerHTML=`
<div style="min-height:100vh;text-align:center;padding:50px 20px;
background:linear-gradient(135deg,#ff00cc,#7b00ff,#ff2e8b);
color:white;font-family:'Segoe UI',sans-serif;">

<div style="width:150px;height:150px;background:#28a745;border-radius:50%;
margin:40px auto;display:flex;align-items:center;justify-content:center;">
<span style="font-size:75px;font-weight:bold;">✓</span>
</div>

<h1>Order Checking!</h1>
<p>Please send payment screenshot & Instagram link on WhatsApp for verification.</p>

<div style="background:white;color:black;border-radius:25px;padding:30px;margin:30px auto;max-width:380px;">
<div>Order ID</div>
<div style="color:#dc3545;font-size:24px;font-weight:bold;">${orderId}</div>
</div>

<a href="https://wa.me/917258028139?text=Hello%20I%20have%20completed%20payment.%20My%20Order%20ID:%20${orderId}" target="_blank">
<button style="padding:15px 40px;border:none;border-radius:30px;background:#25D366;color:white;font-size:16px;">
Send Screenshot on WhatsApp
</button>
</a>

<br><br>

<button onclick="location.reload()" style="padding:15px 40px;border:none;border-radius:30px;background:#ccc;font-size:16px;">
Back To Home
</button>

</div>`;
}
</script>

</body>
</html>
